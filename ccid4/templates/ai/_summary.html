<div class="ai-panel" role="status">
  <div class="flex flex-wrap items-center gap-2"><span class="ai-badge">ร่างโดย AI – รอตรวจ</span><b class="text-sm">พฤติการณ์แห่งคดีที่ AI เรียบเรียง</b></div>
  <p class="text-sm whitespace-pre-line doc-preview">{{ text }}</p>
  <div class="flex flex-wrap gap-2">
    <button type="button" class="btn btn-primary btn-sm" data-apply-ai="{{ apply }}">ใช้ข้อความนี้ (แก้ต่อได้ แล้วกดบันทึก)</button>
    <button type="button" class="btn btn-secondary btn-sm" data-dismiss-ai>ไม่ใช้</button>
  </div>
</div>
