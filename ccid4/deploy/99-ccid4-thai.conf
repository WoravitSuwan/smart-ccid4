<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Documents name "TH Sarabun New" (what Word users have). On the server, render it
     with Laksaman from fonts-thai-tlwg, a free font with the same design lineage. -->
<fontconfig>
  <alias binding="same"><family>TH Sarabun New</family><prefer><family>Laksaman</family></prefer></alias>
  <alias binding="same"><family>TH SarabunPSK</family><prefer><family>Laksaman</family></prefer></alias>
  <alias binding="same"><family>Sarabun</family><prefer><family>Laksaman</family></prefer></alias>
</fontconfig>
