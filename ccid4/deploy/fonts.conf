<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Documents ask for TH SarabunIT๙. If its .ttf is in fonts/ it is used as is; otherwise
     Laksaman (fonts-thai-tlwg, same design family) renders it so PDFs stay readable. -->
<fontconfig>
  <alias binding="weak"><family>TH SarabunIT๙</family><accept><family>Laksaman</family></accept></alias>
  <alias binding="weak"><family>TH Sarabun New</family><accept><family>Laksaman</family></accept></alias>
</fontconfig>
